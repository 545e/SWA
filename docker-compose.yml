services:
  swa-ai:
    build: .
    container_name: swa-ai-cyber-hub
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SWA_HOST=0.0.0.0
      - SWA_PORT=8000
      - DOCKER_CONTAINER=1
      - SWA_DB_PATH=/data/swa_data.db
    volumes:
      - swa_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  swa_data:
