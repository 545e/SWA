name: Docker Build & Container Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: swa-ai:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Health
        run: |
          docker run -d -p 8000:8000 -e SWA_HOST=0.0.0.0 --name test-swa swa-ai:latest
          sleep 8
          docker logs test-swa
          curl -f --retry 6 --retry-connrefused --retry-delay 2 http://localhost:8000/api/settings || (docker logs test-swa && exit 1)

      - name: Cleanup Container
        if: always()
        run: |
          docker rm -f test-swa || true
