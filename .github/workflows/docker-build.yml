name: Docker Build & Container Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: swa-ai:latest
          load: true

      - name: Test Container Health
        run: |
          docker run -d -p 8000:8000 --name test-swa swa-ai:latest
          sleep 6
          curl -f http://localhost:8000/api/settings || exit 1
          docker stop test-swa
