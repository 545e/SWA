apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: swa-ai-hub
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      containers:
      - image: gcr.io/YOUR_GCP_PROJECT/swa-ai:latest
        ports:
        - name: http1
          containerPort: 8000
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: SWA_HOST
          value: "0.0.0.0"
        - name: SWA_PORT
          value: "8000"
        - name: DOCKER_CONTAINER
          value: "1"
        - name: SWA_DB_PATH
          value: "/data/swa_data.db"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
